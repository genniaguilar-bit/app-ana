<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicador de Preocupación - Genni Aguilar</title>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;background:#f0f4ff;margin:0;padding:20px}
  .header{background:white;max-width:700px;margin:0 auto 20px;padding:25px;border-radius:20px;box-shadow:0 4px 15px rgba(0,0,0,.1);text-align:center}
  .foto{width:160px;height:160px;margin:0 auto 15px;border-radius:50%;overflow:hidden;border:4px solid #1e3a8a;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:50px;color:#1e3a8a}
  .foto img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .card{background:white;max-width:700px;margin:20px auto;padding:25px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
  .item{background:#f8fafc;padding:12px;border-radius:8px;margin:10px 0;border-left:4px solid #1e3a8a}
  #resultado{margin-top:20px}
  .bajo{background:#dcfce7;color:#166534;border:2px solid #22c55e;padding:15px;border-radius:10px;text-align:center;font-weight:bold}
  .medio{background:#fef9c3;color:#854d0e;border:2px solid #eab308;padding:15px;border-radius:10px;text-align:center;font-weight:bold}
  .alto{background:#fee2e2;color:#991b1b;border:2px solid #ef4444;padding:15px;border-radius:10px;text-align:center;font-weight:bold}
</style>
</head>
<body>

<div class="header">
  <div class="foto" id="fotoBox">GA</div>
  <h1 style="margin:10px 0 5px;color:#1e3a8a;font-size:22px">Genni Agustín Aguilar Hernández</h1>
  <p style="margin:0;color:#555;font-weight:bold">Médico - Formación Autodidacta</p>
  <p style="margin:5px 0 0;font-size:12px;color:#888">COD-IMG-20260804-9F4B2A ✓ | https://genniaguilar-bit.github.io/app-ana/</p>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <button onclick="document.getElementById('fileInput').click()" style="margin-top:12px;background:#1e3a8a;color:white;border:none;padding:8px 16px;border-radius:20px;cursor:pointer">📷 Poner mi foto</button>
</div>

<div class="card">
  <h2 style="color:#1e3a8a;text-align:center;margin-top:0">Indicador de Preocupación</h2>
  <p style="text-align:center;color:#666;font-size:14px">Marca lo que observes en el usuario</p>
  <div class="item"><label><input type="checkbox" id="c1" onchange="calcular()"> <b>1. Expresión Verbal</b> - El usuario expresa miedo, temor</label></div>
  <div class="item"><label><input type="checkbox" id="c2" onchange="calcular()"> <b>2. Comportamiento</b> - Signos de inquietud, llanto, temblor</label></div>
  <hr style="margin:20px 0">
  <div id="resultado"></div>
</div>

<script>
function calcular(){
  let total=0;
  if(document.getElementById('c1').checked) total++;
  if(document.getElementById('c2').checked) total++;
  let r=document.getElementById('resultado');
  if(total==0) r.innerHTML='<div class=bajo>🟢 NIVEL BAJO<br><span style="font-weight:normal">Conducta: Continuar con la atención habitual.</span></div>';
  if(total==1) r.innerHTML='<div class=medio>🟡 NIVEL MODERADO<br><span style="font-weight:normal">Conducta: Validar emoción y dar más información.</span></div>';
  if(total==2) r.innerHTML='<div class=alto>🔴 NIVEL ALTO<br><span style="font-weight:normal">Conducta: Detener, ofrecer agua y avisar a supervisor.</span></div>';
}
calcular();
document.getElementById('fileInput').addEventListener('change',function(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    document.getElementById('fotoBox').innerHTML='<img src="'+ev.target.result+'">';
  };
  reader.readAsDataURL(file);
});
</script>
</body>
</html>
