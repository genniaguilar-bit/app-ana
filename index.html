<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicador de Preocupación</title>
<style>
body{font-family:Arial;padding:20px;max-width:500px;margin:auto}
h1{color:#333}
.item{font-size:18px;margin:15px 0}
.bajo{background:#d4edda;padding:15px;border-radius:10px;color:#155724}
.medio{background:#fff3cd;padding:15px;border-radius:10px;color:#856404}
.alto{background:#f8d7da;padding:15px;border-radius:10px;color:#721c24}
</style>
</head>
<body>
<h1>Indicador de Preocupación</h1>

<div class="item"><input type="checkbox" id="c1" onchange="calcular()"> 1. Expresión Verbal - El usuario expresa miedo</div>
<div class="item"><input type="checkbox" id="c2" onchange="calcular()"> 2. Comportamiento - Signos de inquietud</div>

<hr>
<div id="resultado"></div>

<script>
function calcular(){
let total=0;
if(document.getElementById('c1').checked) total++;
if(document.getElementById('c2').checked) total++;
let r=document.getElementById('resultado');
if(total==0) r.innerHTML='<div class=bajo>🟢 NIVEL BAJO<br>Conducta: Continuar con la atención habitual.</div>';
if(total==1) r.innerHTML='<div class=medio>🟡 NIVEL MODERADO<br>Conducta: Validar emoción y dar más información.</div>';
if(total==2) r.innerHTML='<div class=alto>🔴 NIVEL ALTO<br>Conducta: Detener, ofrecer agua y avisar a supervisor.</div>';
}
calcular();
</script>
</body>
</html>
